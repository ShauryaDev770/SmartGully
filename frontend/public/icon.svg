<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <!-- Background Circle with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Perspective Road -->
  <polygon points="176,120 336,120 420,440 92,440" fill="url(#road)" />

  <!-- Road Shoulder lines -->
  <line x1="176" y1="120" x2="92" y2="440" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
  <line x1="336" y1="120" x2="420" y2="440" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

  <!-- Dashed Center Line -->
  <line x1="256" y1="130" x2="256" y2="180" stroke="#fbbf24" stroke-width="12" stroke-linecap="round"/>
  <line x1="256" y1="210" x2="256" y2="280" stroke="#fbbf24" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="320" x2="256" y2="420" stroke="#fbbf24" stroke-width="18" stroke-linecap="round"/>

  <!-- AI Radar Pulse Waves -->
  <circle cx="256" cy="300" r="90" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="8 8"/>
  <circle cx="256" cy="300" r="130" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Pothole Target Ring -->
  <ellipse cx="256" cy="360" rx="65" ry="26" fill="#090d16" stroke="#ef4444" stroke-width="8"/>
  <ellipse cx="256" cy="360" rx="42" ry="16" fill="#020617"/>

  <!-- Map Alert Pin -->
  <g transform="translate(256, 250)">
    <path d="M 0 -80 C -35 -80 -60 -55 -60 -20 C -60 25 0 75 0 75 C 0 75 60 25 60 -20 C 60 -55 35 -80 0 -80 Z" fill="url(#pin)" filter="drop-shadow(0px 8px 12px rgba(0,0,0,0.5))"/>
    <circle cx="0" cy="-22" r="22" fill="#ffffff"/>
    <!-- Exclamation Mark inside pin -->
    <rect x="-3.5" y="-36" width="7" height="18" rx="3.5" fill="#b91c1c"/>
    <circle cx="0" cy="-10" r="4.5" fill="#b91c1c"/>
  </g>
</svg>
